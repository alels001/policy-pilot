[project]
name = "policy-pilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ali Elshafey", email = "274659349+alels001@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.20",
    "openai>=3.39.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
policy-pilot = "policy-pilot:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
[tool.ruff]
line-length = 100

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
